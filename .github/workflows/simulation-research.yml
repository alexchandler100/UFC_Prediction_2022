name: Simulation research (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded research operation to run
        required: true
        type: choice
        default: tests
        options:
          - tests
          - round-backfill
          - fit
          - backtest
      backfill_max_fights:
        description: Round pages to fetch (1-100; round-backfill only)
        required: true
        type: string
        default: "25"
      backfill_checkpoint_every:
        description: Save after this many fights (1-25; round-backfill only)
        required: true
        type: string
        default: "5"
      fit_bootstrap_members:
        description: Event-card bootstrap members (fit only; maximum 200)
        required: true
        type: choice
        default: "200"
        options:
          - "200"
          - "100"
          - "64"
      backtest_bootstrap_members:
        description: Per-fold bootstrap members (backtest only; maximum 64)
        required: true
        type: choice
        default: "64"
        options:
          - "64"
          - "32"
          - "16"
      backtest_paths_per_matchup:
        description: Nested paths per historical matchup (backtest only)
        required: true
        type: choice
        default: "4096"
        options:
          - "4096"
          - "16384"
      backtest_first_year:
        description: First chronological test year
        required: true
        type: string
        default: "2017"
      backtest_last_year:
        description: Last chronological test year
        required: true
        type: string
        default: "2026"
      backtest_max_fights:
        description: Maximum historical matchups to simulate (1-500)
        required: true
        type: string
        default: "200"
      backtest_workers:
        description: Standard-runner worker processes (backtest only; maximum 2)
        required: true
        type: choice
        default: "2"
        options:
          - "2"
          - "1"
      upload_compact_artifact:
        description: Upload one validated compact research result for three days
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simulation-research-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    # The 200-fight/4,096-path chronological screen refits every fold. Keep the
    # standard-runner ceiling realistic while the input and worker caps prevent
    # an accidentally unbounded dispatch.
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      # Keep numerical libraries from multiplying threads inside each bounded
      # simulation worker process on the standard runner.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      RESEARCH_OUTPUT_DIR: artifacts/simulations/workflow
      COMPACT_UPLOAD_DIR: artifacts/simulations/compact-upload
      MAX_COMPACT_ARTIFACT_BYTES: "5242880"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Enforce bounded manual inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BACKFILL_MAX_FIGHTS: ${{ inputs.backfill_max_fights }}
          BACKFILL_CHECKPOINT_EVERY: ${{ inputs.backfill_checkpoint_every }}
          FIT_BOOTSTRAP_MEMBERS: ${{ inputs.fit_bootstrap_members }}
          BACKTEST_BOOTSTRAP_MEMBERS: ${{ inputs.backtest_bootstrap_members }}
          BACKTEST_PATHS_PER_MATCHUP: ${{ inputs.backtest_paths_per_matchup }}
          BACKTEST_FIRST_YEAR: ${{ inputs.backtest_first_year }}
          BACKTEST_LAST_YEAR: ${{ inputs.backtest_last_year }}
          BACKTEST_MAX_FIGHTS: ${{ inputs.backtest_max_fights }}
          BACKTEST_WORKERS: ${{ inputs.backtest_workers }}
          UPLOAD_COMPACT_ARTIFACT: ${{ inputs.upload_compact_artifact }}
        run: |
          require_bounded_integer() {
            local label="$1"
            local value="$2"
            local lower="$3"
            local upper="$4"
            if ! [[ "$value" =~ ^[0-9]+$ ]] || (( value < lower || value > upper )); then
              echo "::error::${label} must be an integer from ${lower} through ${upper}."
              exit 2
            fi
          }

          case "$MODE" in
            tests)
              if [[ "$UPLOAD_COMPACT_ARTIFACT" == "true" ]]; then
                echo "::error::Tests do not produce a compact research artifact to upload."
                exit 2
              fi
              ;;
            round-backfill)
              require_bounded_integer backfill_max_fights "$BACKFILL_MAX_FIGHTS" 1 100
              require_bounded_integer backfill_checkpoint_every "$BACKFILL_CHECKPOINT_EVERY" 1 25
              ;;
            fit)
              require_bounded_integer fit_bootstrap_members "$FIT_BOOTSTRAP_MEMBERS" 1 200
              ;;
            backtest)
              require_bounded_integer backtest_bootstrap_members "$BACKTEST_BOOTSTRAP_MEMBERS" 1 64
              require_bounded_integer backtest_paths_per_matchup "$BACKTEST_PATHS_PER_MATCHUP" 1 16384
              require_bounded_integer backtest_first_year "$BACKTEST_FIRST_YEAR" 1993 2100
              require_bounded_integer backtest_last_year "$BACKTEST_LAST_YEAR" 1993 2100
              require_bounded_integer backtest_max_fights "$BACKTEST_MAX_FIGHTS" 1 500
              require_bounded_integer backtest_workers "$BACKTEST_WORKERS" 1 2
              if (( BACKTEST_FIRST_YEAR > BACKTEST_LAST_YEAR )); then
                echo "::error::backtest_first_year must not exceed backtest_last_year."
                exit 2
              fi
              ;;
            *)
              echo "::error::Unsupported research mode: ${MODE}"
              exit 2
              ;;
          esac

      - name: Create ignored local output directory
        run: mkdir -p "$RESEARCH_OUTPUT_DIR"

      - name: Run simulation contract tests
        if: ${{ inputs.mode == 'tests' }}
        run: python -B -m unittest discover -s tests -v

      - name: Backfill a bounded round-data batch
        if: ${{ inputs.mode == 'round-backfill' }}
        env:
          MAX_FIGHTS: ${{ inputs.backfill_max_fights }}
          CHECKPOINT_EVERY: ${{ inputs.backfill_checkpoint_every }}
        run: |
          python -m fight_sim backfill \
            --max-fights "$MAX_FIGHTS" \
            --checkpoint-every "$CHECKPOINT_EVERY" \
            --summary-output "$RESEARCH_OUTPUT_DIR/round-backfill-summary.json"

      - name: Fit a frozen candidate parameter ensemble
        if: ${{ inputs.mode == 'fit' }}
        env:
          BOOTSTRAP_MEMBERS: ${{ inputs.fit_bootstrap_members }}
        run: |
          python -m fight_sim fit \
            --bootstrap-members "$BOOTSTRAP_MEMBERS" \
            --output "$RESEARCH_OUTPUT_DIR/parameter_model.json.gz"

      - name: Run a bounded chronological backtest
        if: ${{ inputs.mode == 'backtest' }}
        env:
          BOOTSTRAP_MEMBERS: ${{ inputs.backtest_bootstrap_members }}
          PATHS_PER_MATCHUP: ${{ inputs.backtest_paths_per_matchup }}
          FIRST_TEST_YEAR: ${{ inputs.backtest_first_year }}
          LAST_TEST_YEAR: ${{ inputs.backtest_last_year }}
          MAX_FIGHTS: ${{ inputs.backtest_max_fights }}
          WORKERS: ${{ inputs.backtest_workers }}
        run: |
          python -m fight_sim backtest \
            --bootstrap-members "$BOOTSTRAP_MEMBERS" \
            --paths-per-matchup "$PATHS_PER_MATCHUP" \
            --first-test-year "$FIRST_TEST_YEAR" \
            --last-test-year "$LAST_TEST_YEAR" \
            --max-fights "$MAX_FIGHTS" \
            --workers "$WORKERS" \
            --chunk-size 64 \
            --output "$RESEARCH_OUTPUT_DIR/backtest_report.json"

      - name: Validate and stage one compact artifact
        if: ${{ inputs.upload_compact_artifact && inputs.mode != 'tests' }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - "$MODE" "$RESEARCH_OUTPUT_DIR" "$COMPACT_UPLOAD_DIR" "$MAX_COMPACT_ARTIFACT_BYTES" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          from fight_sim.evaluation import load_backtest_report
          from fight_sim.parameters import inspect_parameter_artifact

          mode, output_text, staging_text, limit_text = sys.argv[1:]
          allowed = {
              "round-backfill": "round-backfill-summary.json",
              "fit": "parameter_model.json.gz",
              "backtest": "backtest_report.json",
          }
          if mode not in allowed:
              raise SystemExit(f"artifact upload is unsupported for mode {mode!r}")

          source = Path(output_text) / allowed[mode]
          limit = int(limit_text)
          if not source.is_file():
              raise SystemExit(f"expected compact artifact is missing: {source}")
          if source.stat().st_size <= 0 or source.stat().st_size > limit:
              raise SystemExit(
                  f"compact artifact must be between 1 and {limit} bytes: {source}"
              )

          if mode == "fit":
              inspection = inspect_parameter_artifact(source).validate()
              if inspection.bootstrap_members <= 0:
                  raise SystemExit("parameter artifact has no committed members")
          elif mode == "backtest":
              report = load_backtest_report(source).validate()
              if (
                  report.candidate_only is not True
                  or report.production_enabled is not False
                  or report.execution_enabled is not False
              ):
                  raise SystemExit("backtest artifact is not isolated candidate research")
          else:
              payload = json.loads(source.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit("compact summary must be a JSON object")
              required = {
                  "attempted_fights",
                  "saved_fights",
                  "failed_fights",
                  "remaining_fights",
                  "saved_round_rows",
                  "reconciliation_issues",
              }
              missing = required - payload.keys()
              if missing:
                  raise SystemExit(f"round-backfill summary is missing {sorted(missing)}")
              if any(
                  isinstance(payload[key], bool)
                  or not isinstance(payload[key], int)
                  or payload[key] < 0
                  for key in required
              ):
                  raise SystemExit("round-backfill summary counts must be nonnegative integers")
              if payload["attempted_fights"] != (
                  payload["saved_fights"] + payload["failed_fights"]
              ):
                  raise SystemExit("round-backfill attempted count is incoherent")
              if payload["attempted_fights"] > 100:
                  raise SystemExit("round-backfill summary exceeds the workflow cap")

          staging = Path(staging_text)
          staging.mkdir(parents=True, exist_ok=True)
          destination = staging / source.name
          shutil.copy2(source, destination)
          staged = [path for path in staging.rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in staged)
          if staged != [destination] or total > limit:
              raise SystemExit("compact upload staging violated the one-file 5 MiB cap")
          print(f"Validated {destination} ({total} bytes) for short-lived upload.")
          PY

      - name: Upload validated compact research result
        if: ${{ inputs.upload_compact_artifact && inputs.mode != 'tests' }}
        uses: actions/upload-artifact@v4
        with:
          name: fight-sim-${{ inputs.mode }}-${{ github.run_id }}
          path: artifacts/simulations/compact-upload/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
          compression-level: 9
