name: Collect UFC market snapshot

on:
  workflow_dispatch:
  schedule:
    # Sixteen observations cover the first Sunday post-publication price,
    # midweek movement, T-24, and the final hours. Together with the
    # Sunday/Wednesday updater this is about 19 requests/week; at the configured
    # two-region request cost across moneyline and totals that is roughly 330 credits in
    # an average month, within the current 500-credit development allowance.
    # The collector exits successfully without using an API credit once a
    # previously timed card has commenced.
    # Sunday captures follow the 9:33 AM publisher and its 8:33 PM retry.
    - cron: "17 10,21 * * 0"
      timezone: "America/Chicago"
    - cron: "17 23 * * 1"
      timezone: "America/Chicago"
    - cron: "17 12,18 * * 2,3,4"
      timezone: "America/Chicago"
    - cron: "17 12,18,23 * * 5"
      timezone: "America/Chicago"
    - cron: "17 9,12,15,18 * * 6"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  # Serialize with the authoritative updater: both workflows publish commits
  # derived from the exact revision they checked out.
  group: publish-ufc-data-main
  cancel-in-progress: false

jobs:
  capture_market:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MARKET_ODDS_SOURCE: "the-odds-api"
      ODDS_API_REGIONS: "us,us2"
      # The user explicitly approved low-rate collection from the same public
      # BestFightOdds paths used by the local historical research backfill.
      BESTFIGHTODDS_SOURCE_POLICY_ACKNOWLEDGED: "1"

    steps:
      - name: Check out frozen publication
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run offline contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate frozen publication
        run: python src/validate_data.py --require-model-artifact

      - name: Verify market API credential
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "${THE_ODDS_API_KEY}" ]; then
            echo "::error::THE_ODDS_API_KEY is missing. Add the free key under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Capture fresh MMA market data
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python src/capture_market_snapshot.py

      - name: Capture bounded method-of-victory prices
        id: method_capture
        # Method prices are useful enrichment, but an optional source outage
        # must not discard a healthy moneyline/totals capture.
        continue-on-error: true
        run: python src/capture_method_market_snapshot.py

      - name: Settle completed paper decisions and refresh metrics
        run: python src/update_market_performance.py

      - name: Revalidate market ledgers and bounded report
        run: |
          python src/capture_market_snapshot.py --validate-only
          python src/validate_data.py --require-model-artifact --require-market-data

      - name: Revalidate optional method-price outputs
        if: steps.method_capture.outcome == 'success'
        run: python src/capture_method_market_snapshot.py --validate-only

      - name: Commit only market capture outputs
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -- \
            src/content/data/market/quote_snapshots.csv \
            src/content/data/market/quote_snapshots.jsonl \
            src/content/data/market/forecast_captures.csv \
            src/content/data/market/forecast_captures.jsonl \
            src/content/data/market/quote_source_metadata.csv \
            src/content/data/market/quote_source_metadata.jsonl \
            src/content/data/market/paper_decisions.csv \
            src/content/data/market/paper_decisions.jsonl \
            src/content/data/market/bayesian_filtered_paper_decisions.csv \
            src/content/data/market/bayesian_filtered_paper_decisions.jsonl \
            src/content/data/market/paper_settlements.csv \
            src/content/data/market/paper_settlements.jsonl \
            src/content/data/market/simulation_comparisons.csv \
            src/content/data/market/simulation_comparisons.jsonl \
            src/content/data/market/performance_report.json \
            src/content/data/market/capture_report.json \
            src/content/data/market/current_opportunities.json

          # Stage newly introduced research ledgers and optional prop
          # enrichment when present. Their own validators still require
          # complete mirrors after a capture creates their contract.
          for optional_path in \
            src/content/data/market/early_market_observations.csv \
            src/content/data/market/early_market_observations.jsonl \
            src/content/data/market/early_market_ufc_links.csv \
            src/content/data/market/early_market_ufc_links.jsonl \
            src/content/data/market/total_round_quote_snapshots.csv \
            src/content/data/market/total_round_quote_snapshots.jsonl \
            src/content/data/market/total_round_forecast_captures.csv \
            src/content/data/market/total_round_forecast_captures.jsonl \
            src/content/data/market/total_round_paper_decisions.csv \
            src/content/data/market/total_round_paper_decisions.jsonl \
            src/content/data/market/total_round_paper_settlements.csv \
            src/content/data/market/total_round_paper_settlements.jsonl \
            src/content/data/market/method_market_snapshots.csv \
            src/content/data/market/method_market_snapshots.jsonl \
            src/content/data/market/method_capture_report.json \
            src/content/data/market/current_method_markets.json
          do
            if [ -f "$optional_path" ]; then
              git add -- "$optional_path"
            fi
          done

          while IFS= read -r staged_path; do
            case "$staged_path" in
              src/content/data/market/quote_snapshots.csv|\
              src/content/data/market/quote_snapshots.jsonl|\
              src/content/data/market/forecast_captures.csv|\
              src/content/data/market/forecast_captures.jsonl|\
              src/content/data/market/quote_source_metadata.csv|\
              src/content/data/market/quote_source_metadata.jsonl|\
              src/content/data/market/early_market_observations.csv|\
              src/content/data/market/early_market_observations.jsonl|\
              src/content/data/market/early_market_ufc_links.csv|\
              src/content/data/market/early_market_ufc_links.jsonl|\
              src/content/data/market/total_round_quote_snapshots.csv|\
              src/content/data/market/total_round_quote_snapshots.jsonl|\
              src/content/data/market/total_round_forecast_captures.csv|\
              src/content/data/market/total_round_forecast_captures.jsonl|\
              src/content/data/market/total_round_paper_decisions.csv|\
              src/content/data/market/total_round_paper_decisions.jsonl|\
              src/content/data/market/total_round_paper_settlements.csv|\
              src/content/data/market/total_round_paper_settlements.jsonl|\
              src/content/data/market/method_market_snapshots.csv|\
              src/content/data/market/method_market_snapshots.jsonl|\
              src/content/data/market/method_capture_report.json|\
              src/content/data/market/current_method_markets.json|\
              src/content/data/market/paper_decisions.csv|\
              src/content/data/market/paper_decisions.jsonl|\
              src/content/data/market/bayesian_filtered_paper_decisions.csv|\
              src/content/data/market/bayesian_filtered_paper_decisions.jsonl|\
              src/content/data/market/paper_settlements.csv|\
              src/content/data/market/paper_settlements.jsonl|\
              src/content/data/market/simulation_comparisons.csv|\
              src/content/data/market/simulation_comparisons.jsonl|\
              src/content/data/market/performance_report.json|\
              src/content/data/market/capture_report.json|\
              src/content/data/market/current_opportunities.json)
                ;;
              *)
                echo "Refusing unexpected staged path: $staged_path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "No new validated market capture to commit."
            exit 0
          fi

          git commit -m "Capture UFC market snapshot ($(date -u +%F))"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Main changed during capture; refusing to publish stale market data."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
