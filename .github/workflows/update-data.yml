name: Update UFC data

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour traffic spike and follow Chicago daylight saving time.
    # Sunday morning publishes the next card as soon as the prior event is
    # complete; Sunday evening retries if UFCStats was not ready. Wednesday is
    # the bounded midweek refresh before the T-24 policy.
    - cron: "33 9,20 * * 0"
      timezone: "America/Chicago"
    - cron: "33 21 * * 3"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  update_data:
    runs-on: ubuntu-24.04
    # Only the authoritative data mutation job shares the market publisher lock.
    # The slower simulation job rebases over data-only captures before publishing.
    concurrency:
      group: publish-ufc-data-main
      cancel-in-progress: false
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    # A recent catch-up completed in ~8 minutes; the larger limit permits a
    # catch-up after an outage without silently killing an otherwise healthy rebuild.
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MARKET_ODDS_SOURCE: "the-odds-api"
      ODDS_API_REGIONS: "us,us2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The repository has a large history; the updater only needs the
          # triggering revision plus one explicit remote-tip safety check.
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Validate current snapshot
        run: python src/validate_data.py --allow-stale

      - name: Verify market API credential
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "${THE_ODDS_API_KEY}" ]; then
            echo "::error::THE_ODDS_API_KEY is missing. Add the free key under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Update data and predictions
        working-directory: src
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python update_and_rebuild_model.py

      - name: Record equal-stake prospective comparison
        run: python src/update_equal_stake_experiment.py

      - name: Settle paper decisions and publish return metrics
        working-directory: src
        run: python update_market_performance.py

      - name: Publish paper-bet bankroll history
        run: python src/update_bet_performance.py

      - name: Update frozen market-first prospective paper test
        working-directory: src
        run: python update_market_first_paper.py

      - name: Publish compact current-card odds history
        run: python src/update_odds_history.py

      - name: Validate generated snapshot
        run: |
          python src/update_odds_history.py --validate-only
          python src/update_bet_performance.py --validate-only
          python src/update_market_first_paper.py --validate-only
          python src/update_equal_stake_experiment.py --validate-only
          python src/validate_data.py --require-model-artifact --require-market-data

      - name: Commit validated generated files
        id: publish
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- \
            src/content/data/processed/fighter_stats.csv \
            src/content/data/processed/ufc_fights_reported_doubled.csv \
            src/content/data/processed/external_mma_auxiliary_doubled.csv \
            src/content/data/processed/ufc_fight_data_for_website.csv \
            src/content/data/processed/ufc_fights_point_in_time.csv \
            src/content/data/external/card_info.json \
            src/content/data/external/fighter_explorer.json \
            src/content/data/external/fighter_fights_*.json \
            src/content/data/external/fighter_stats.json \
            src/content/data/external/prediction_history.json \
            src/content/data/external/ufc_fight_data_for_website.json \
            src/content/data/external/vegas_odds.json \
            src/content/data/external/winner_model.json \
            src/content/data/external/bayesian_winner_challenger.json \
            src/content/data/external/outcome_model_evaluation.json \
            src/content/data/external/outcome_forecasts.json \
            src/content/data/external/all_upcoming_forecasts.json \
            src/content/data/market/odds_history.json \
            src/content/data/market/upcoming_bet_board.json \
            src/content/data/market/paper_settlements.csv \
            src/content/data/market/paper_settlements.jsonl \
            src/content/data/market/simulation_comparisons.csv \
            src/content/data/market/simulation_comparisons.jsonl \
            src/content/data/market/performance_report.json \
            src/content/data/market/published_bet_snapshots.json \
            src/content/data/market/bet_performance.json

          for optional_path in \
            src/content/data/processed/ufc_fight_round_stats_doubled.csv \
            src/content/data/processed/ufc_fight_round_stats_reconciliation.csv \
            src/content/data/market/bayesian_filtered_paper_decisions.csv \
            src/content/data/market/bayesian_filtered_paper_decisions.jsonl \
            src/content/data/market/bayesian_logistic_shadow_forecasts.csv \
            src/content/data/market/bayesian_logistic_shadow_forecasts.jsonl \
            src/content/data/market/total_round_paper_settlements.csv \
            src/content/data/market/total_round_paper_settlements.jsonl \
            src/content/data/market/market_first_paper_decisions.csv \
            src/content/data/market/market_first_paper_decisions.jsonl \
            src/content/data/market/market_first_paper_settlements.csv \
            src/content/data/market/market_first_paper_settlements.jsonl \
            src/content/data/market/market_first_paper_report.json \
            src/content/data/market/equal_stake_experiment/policy.json \
            src/content/data/market/equal_stake_experiment/decisions.json \
            src/content/data/market/equal_stake_experiment/settlements.json \
            src/content/data/market/equal_stake_experiment/report.json
          do
            if [ -f "$optional_path" ]; then
              git add -- "$optional_path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update UFC data ($(date -u +%F))"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Main changed during this build; refusing to publish artifacts built from older code."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  upcoming_simulations:
    name: Simulate newly announced fights (paper only)
    needs: update_data
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: simulation-upcoming-${{ github.ref }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Check out the production update
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update_data.outputs.published_sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Simulate only newly discovered eligible matchups
        run: |
          python src/update_upcoming_simulations.py \
            --simulator-config SIMULATION_MECHANICS_BASELINE_V1.json \
            --bootstrap-members 64 \
            --paths-per-member 64 \
            --workers 2 \
            --chunk-size 64 \
            --max-new-matchups 100 \
            --max-runtime-seconds 8700

      - name: Publish immutable matchup records and the upcoming website view
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- src/content/data/external/simulation_forecasts.json
          if [ -d src/content/data/simulation/upcoming_matchups ]; then
            git add -- src/content/data/simulation/upcoming_matchups
          fi
          if git diff --cached --quiet; then
            echo "No new simulation records or website-view changes to commit."
            exit 0
          fi
          git commit -m "Update upcoming UFC simulations ($(date -u +%F))"
          simulation_base=$(git rev-parse HEAD^)
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          remote_tip=$(git rev-parse FETCH_HEAD)
          if [ "$simulation_base" != "$remote_tip" ]; then
            changed_paths=$(git diff --name-only "$simulation_base" "$remote_tip")
            if echo "$changed_paths" | grep -Ev '^(src/content/data/|$)' >/dev/null; then
              echo "Code changed during simulation; refusing to publish results from older code."
              exit 1
            fi
            git rebase --onto "$remote_tip" "$simulation_base"
            python src/update_upcoming_simulations.py --publish-only
            git add -- src/content/data/external/simulation_forecasts.json
            git commit --amend --no-edit
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
