name: Update UFC data

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour traffic spike and follow Chicago daylight saving time.
    - cron: "33 21 * * 3"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: update-ufc-data-main
  cancel-in-progress: false

jobs:
  update_data:
    runs-on: ubuntu-24.04
    # Normal runs take ~20 minutes; the larger limit permits a one-time catch-up
    # after an outage without silently killing an otherwise healthy rebuild.
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Validate current snapshot
        run: python src/validate_data.py --allow-stale

      - name: Update data and predictions
        working-directory: src
        run: python update_and_rebuild_model.py

      - name: Validate generated snapshot
        run: python src/validate_data.py

      - name: Commit validated generated files
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- \
            src/content/data/processed \
            src/content/data/external \
            src/content/bokehPlots

          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            exit 0
          fi

          git commit -m "Update UFC data ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
