name: Update UFC data

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour traffic spike and follow Chicago daylight saving time.
    - cron: "33 21 * * 3"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that can publish data so a market capture cannot
  # race the authoritative model/data update.
  group: publish-ufc-data-main
  cancel-in-progress: false

jobs:
  update_data:
    runs-on: ubuntu-24.04
    # A recent catch-up completed in ~8 minutes; the larger limit permits a
    # catch-up after an outage without silently killing an otherwise healthy rebuild.
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MARKET_ODDS_SOURCE: "the-odds-api"
      ODDS_API_REGIONS: "us,us2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The repository has a large history; the updater only needs the
          # triggering revision plus one explicit remote-tip safety check.
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Validate current snapshot
        run: python src/validate_data.py --allow-stale

      - name: Verify market API credential
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "${THE_ODDS_API_KEY}" ]; then
            echo "::error::THE_ODDS_API_KEY is missing. Add the free key under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Update data and predictions
        working-directory: src
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python update_and_rebuild_model.py

      - name: Settle paper decisions and publish return metrics
        working-directory: src
        run: python update_market_performance.py

      - name: Validate generated snapshot
        run: python src/validate_data.py --require-model-artifact --require-market-data

      - name: Commit validated generated files
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- \
            src/content/data/processed/fighter_stats.csv \
            src/content/data/processed/ufc_fights_reported_doubled.csv \
            src/content/data/processed/ufc_fight_data_for_website.csv \
            src/content/data/processed/ufc_fights_point_in_time.csv \
            src/content/data/external/card_info.json \
            src/content/data/external/fighter_stats.json \
            src/content/data/external/prediction_history.json \
            src/content/data/external/ufc_fight_data_for_website.json \
            src/content/data/external/vegas_odds.json \
            src/content/data/external/winner_model.json \
            src/content/data/market/paper_settlements.csv \
            src/content/data/market/paper_settlements.jsonl \
            src/content/data/market/performance_report.json

          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            exit 0
          fi

          git commit -m "Update UFC data ($(date -u +%F))"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Main changed during this build; refusing to publish artifacts built from older code."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
